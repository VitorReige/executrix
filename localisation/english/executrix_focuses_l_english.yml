  ### Shortcuts ###
  imp_navy_shortcut: "Navy"
  imp_air_shortcut: "Air Force"
  imp_army_shortcut: "Army"
  imp_economy_shortcut: "Economy"
  imp_conquest_shortcut: "Conquest"
  imp_technology_shortcut: "Technology"
  imp_executrix_shortcut: "Executrix"
  ### Executrix Intro Focuses ###
  imp_emergency_power: "Emergency Power"
  imp_emergency_power_desc: "With the Executrix being disabled as it exits hyperspace. It's trajectory is headed towards a seemingly endless desert--with no knowledge of our position, we must carefully decide which systems to restore as we land, deploy our surviving stormtrooper regiments, and assess our situation to find out if this planet is hostile."
  imp_assessing_the_situation: "Assessing the Situation"
  imp_assessing_the_situation_desc: "The surviving Imperial Troopers have reorganized abroad the wreckage of the Executrix and have recovered from the crash. \n\n The Executrix lays scattered across for miles and miles in what seems to be endless sand dunes."
  imp_salvaging_the_equipment: "Salvage Operations"
  imp_salvaging_the_equipment_desc: "We detected a signal coming from the northern perimeter, most likely from a city or mining colony due to the frequency of chatter we pick up from them. We should begin investigating so that we may determine the people inhabiting this planet, a small reconnaissance team should make do."
  imp_repair: "Reconstruction Effort"
  imp_repair_desc: "We cannot risk ourselves on a foreign planet without a strong base of operations with which to defend and conduct ourselves. Having the Imperial Engineering Corps that survived the crash be repurposed temporarily to reconstruction teams ready with a number of working droids will speed our efforts up greatly."
  imp_regrouping_of_command: "Regrouping of The High Command"
  imp_regrouping_of_command_desc: "The surviving members of the High Command have regrouped and are ready to take on the task of leading the survivors and rebuilding our forces. We should begin by assigning them to their respective positions and giving them orders to begin organizing the survivors into a more efficient structure."
  imp_subjugate_iraq: "Subjugate Iraq"
  imp_subjugate_iraq_desc: "To our northwest lies a more developed region of industry and resources, which we will need to acquire in order to begin repairs of our ship and the construction of arms. Allowing them to retain 'control' of their own lands will make the people more receptive to our demands for resources, and save trouble in the future."
  imp_subjugate_saudi: "Subjugate Saudi Arabia"
  imp_subjugate_saudi_desc: "To our south lies a vast desert sparsely populated by locals, if we were to install a local government of our own we could potentially turn these empty lands into something useful for ourselves, while increasing our own ranks."
  imp_phase_one: "Initiate Phase One"
  imp_phase_one_desc: "Now that we have established a foothold in the region we can initiate Phase One."
  imp_beginning_ship_repairs: "Initiate Ship Repairs"
  imp_beginning_ship_repairs_desc: "Our first priority should be to establish a reconstruction site around the crash site so that we may begin repairs on critical areas of the Executrix."
  imp_hull_repair: "Hull Repair"
  imp_hull_repair_desc: "Basic repairs to the hull of the ship will allow us to seal off the ship from the outside air and cool off the interior, allowing everyone inside a breather from the heat of the desert."
  imp_repair_conference_room: "Repair The Conference Room"
  imp_repair_conference_room_desc: "Having a central location with which to meet will allow our highest officials (Which also happen to be Generals and Marshals) to meet in peace aboard the ship, allowing an easier time strategizing while using the ship’s systems."
  imp_executrix_phase_two: "Phase II"
  imp_executrix_phase_two_desc: "We have accumulated enough manpower and resources from our surroundings to begin reconstruction of the ship, allowing for us to utilize previously inaccessible areas blocked off in the crash."
  imp_biweekly_conference: "Bi-weekly Conference"
  imp_biweekly_conference_desc: "Having a biweekly meeting of all high command officials remaining will allow us to adapt to the changing environment we find ourselves in. Physical attendance will not be required, as we may use holo calls to include members serving within the field."
  ### Executrix Focuses ###
  imp_reconstruction_phase_two_branch: "Partially Repaired Ship"
  imp_reconstruction_phase_two_branch_desc: "Our ship lies spread out in three main clusters of debris, our first priority should be the recovery of these major sections and merging them together again. With our ship whole, we can then begin to repair more intricate systems."
  imp_base_iraq: "Establish Bases in Iraq"
  imp_base_iraq_desc: "We must establish bases in Iraq to secure the region and provide a staging ground for our operations. The resources and infrastructure in this area will be crucial for our efforts to rebuild the ship and expand our influence."
  imp_base_saudi: "Establish Bases in Saudi Arabia"
  imp_base_saudi_desc: "The vast desert of Saudi Arabia may not be the most hospitable environment, but it offers strategic advantages for our operations. Establishing bases here will allow us to control key areas and access valuable resources."
  imp_supply_lines_saudi: "Establish Supply Lines"
  imp_supply_lines_saudi_desc: "Most of the territories here are desert and inhibit our movements, we must eliminate this weakness."
  imp_supply_lines_iraq: "Improve Operational Efficiency"
  imp_supply_lines_iraq_desc: "Nothing but wasteland and mountains, we must spend time developing the infrastructure here."
  imp_fortify_crash_site: "The Fortress"
  imp_fortify_crash_site_desc: "We have been able to recover the prefabricated garrisons from the wreckage of the Executrix, and have put them to use with our shield generators in order to provide a heavily fortified area around the entire crash site."
  imp_air_defenses: "Turrets to the Skies!"
  imp_air_defenses_desc: "A limited number of turrets still remain active, however a larger number still remain usable but are unconnected to the ship. We can use the connected turrets to functionally control the airspace around our ship."
  imp_reinforce_bases: "Reinforce Bases"
  imp_reinforce_bases_desc: "We will fortify the bases in the regions so we can have another line of defense. Improving the transport system will also allow us to quickly react to any threats in our sphere of influence, effectively increasing the defenses across our holdings."
  imp_navigation_repair: "Navigation System Repair"
  imp_navigation_repair_desc: "Repairing the ships navigational systems will allow us to locate enemy aircraft with relative ease, allowing our pilots to operate more effectively. The navigation system is still heavily damaged, only offering marginal detection."
  imp_motion_sensor_i: "Motion Sensors"
  imp_motion_sensor_i_desc: "Using our sensors to spot targets on the ground is a trivial matter once they are further repaired, allowing us to further coordinate our own men and find out the location of enemies in the field."
  imp_restore_weapons_systems: "Restore Weapon Systems"
  imp_restore_weapons_systems_desc: "Rebuilding our main weapons will be a top priority, as the Executor was at one time the most well armed ship in the entire Imperial Navy. Focusing on the concussion missiles will aid us greatly, as their range is enough to cover a wide radius around the ship."
  imp_complement_1: "Restore Hangars"
  imp_complement_1_desc: "Repairing the Hangars will go a long way in increasing our ability to wage war. Currently our aircraft must land in the sandy dunes of whatever airfields we conquer, not optimized for aircraft that are able to take off and land without the need of a landing strip."
  imp_shield_repair: "Shield Repair"
  imp_shield_repair_desc: "Repairing the hull allows us to use our power plants at a higher efficiency, which in turn will allow us to begin repairs on the shields to protect ourselves from any enemy bombardment."
  imp_reinforce_supply_chain: "Reinforce Supply Connections"
  imp_reinforce_supply_chain_desc: "By utilizing the remaining droids we have functional, we can use them to create infrastructure leading to our most important regions, creating new roads where previously none had existed. This is a top priority, for without adequate supply lines our technological advantage means nothing."
  imp_executrix_hanger_resupply: "Rebuilding Hanger Supply-Hubs"
  imp_executrix_hanger_resupply_desc: "Repairing the Hangars allowed our aircraft to dock within the Executor once more. Currently our aircraft can now re-use the resupply devices and machines located within the hangers, but we will have to spend some time to repair these instruments. Once the repairs are complete, our aircraft will be able to resupply on a constant basis improving operational efficiency."
  imp_complement_2: "Expand Hangars"
  imp_complement_2_desc: "Finally clearing our hangar of wreckage has given us plenty of space to work with, allowing us to house our newly constructed aircraft."
  imp_auxiliary_systems_complete: "Finish Auxiliary Systems"
  imp_complement_air: "TIE Series: Salaving the Wreckage"
  imp_complement_air_desc: "With the hangars repaired and cleared out once more, we can salvage any workable TIEs held within and make repairs to the damaged craft we have available."
  imp_complement_air2: "TIE Series: Salaving the Wreckage II"
  imp_phase_three: "Half Functional Ship"
  imp_phase_three_desc: "Repairing basic systems such as air circulation and electricity throughout the entire ship will provide a boost to morale, and allow us to greatly improve the quality of life onboard. It will also allow for us to begin work on more detailed systems such as the advanced sensors."
  imp_motion_sensor_ii: "Advanced Motion Sensors"
  imp_motion_sensor_ii_desc: "Further repairs allow for us to detect enemy aircraft as they take off, allowing increased air superiority in any region we choose to occupy."
  imp_auxiliary_systems_complete: "Finish Auxiliary Systems"
  imp_auxiliary_systems_complete_desc: "The ships sensors are operating at nearly 100%, allowing us to effectively detect enemies and coordinate our defenses with field commanders being given information as soon as it’s available."
  imp_auxiliary_reactor_repair: "Repair Auxiliary Reactors"
  imp_auxiliary_reactor_repair_desc: "With many of the primary systems aboard the ship now repaired, we should turn our atttention to the auxiliary reactors. Repairing theses reactors will provide the Executrix with its own independent power source."
  imp_hull_repair2: "Finalize Hull Repairs"
  imp_hull_repair2_desc: "Completely resealing the hull will allow us to one day return to space, and in the meantime it allows for us to house all of our troopers inside of the ship once again, and makes us nearly invulnerable to any kind of bombing our enemies may attempt."
  imp_complement_land_1: "Walker/Tank Support"
  imp_complement_land_1_desc: "With our prefabricated garrisons there were also large numbers of ground vehicles stored in a nearby hangar. With time and effort, we could begin to clear the rubble and salvage what vehicles we can. It is likely a number of vehicles survived due to their high durability, and location of the hangar."
  imp_phase_four: "Grounded Ship"
  imp_phase_four_desc: "With the ship's primary systems repaired, we can now focus on repairing the more intricate systems that will allow us to get the Executrix in the Earth's orbit."
  imp_hyper_reactor_repair: "Repairing the Hypermatter Reactor"
  imp_hyper_reactor_repair_desc: "The hypermatter reactor is the Executrix's main power source. The reactor was heavily damaged in the crash and our reports indicate that more time will be needed to repair it due to work arounds our engineers need to make due to the lack of hypermatter on the planet."
  imp_all_systems_operational: "All Systems Operational"
  imp_all_systems_operational_desc: "With all of the ship's systems repaired, we can now begin preparations to get the Executrix airborne and into orbit."
  imp_executrix_in_orbit: "Executrix In Orbit"
  imp_executrix_in_orbit_desc: "The Executrix is go for takeoff. The Executrix will soon be a symbol of fear and power to those who would oppose us."
  imp_orbital_bombardment: "Orbital Bombardment"
  imp_orbital_bombardment_desc: "With the Executrix in orbit, we can now activate the ship's primary weapons and strike the surface of the planet. This will allow us to devestate our remaining enemies."
  imp_starship_executrix: "Starship Executrix"
  imp_starship_executrix_desc: "The Executrix is the symbol of Imperial Might on Earth."
  ###Conquest Branch ###
  imp_prepare_for_expansion: "War Plans"
  imp_prepare_for_expansion_desc: "Planning out our assaults on our neighbors will allow us greater lethality and speed in subjugating them. Using our newly repaired conference room we will swiftly plan to end the conflicts with our neighbors while mitigating casualties to our own men where possible."
  imp_intimidate_yemen_and_oman: "Intimidate Yemen and Oman"
  imp_intimidate_yemen_and_oman_desc: "Yemen and Oman are weak nations to our south that must be controlled in order to secure our border. It should be no issue to intimidate them into folding into our rule."
  imp_colonial_deal: "Colonial Agreement"
  imp_colonial_deal_desc: "We can negotiate with the bordering colonial powers of this planet in giving us the surrounding territories. These territories will help make our borders more coherent and allow room for development."
  imp_subjugate_iran: "Subjugate Iran"
  imp_subjugate_iran_desc: "The time has come to take the land known as Iran. It is a large country rich with resources, and it is a strategic location for us to control.""
  imp_integrate_iran: "Integrate Iran"
  imp_integrate_iran_desc: "Iran has been under our control for some time now, and it is time to fully integrate them into our empire. We can use their resources and manpower to further our goals, and they will be better off under our rule than they were before."
  imp_prepare_for_afghanistan: "Prepare For Afghanistan"
  imp_prepare_for_afghanistan_desc: "Afghanistan is a mountainous country which would be difficult to conquer with very few airports and a lack of supply infastructure. We should send a logistics team to the region to build critical supply lines and makeshift airfields to allow us to more easily conquer the region when the time comes."
  imp_subjugate_afghanistan: "Subjugate Afghanistan"
  imp_subjugate_afghanistan_desc: "Now that we have prepared the region, we can begin our assault on Afghanistan. The mountainous terrain will make this a difficult fight, but with our superior technology and air support we should be able to quickly subjugate the region."
  imp_integrate_afghanistan: "Integrate Afghanistan"
  imp_integrate_afghanistan_desc: "With Afghanistan under our control, it is now time to integrate the region into our empire. With the resources and manpower of Afghanistan, we can further our goals and make the region more prosperous under our rule."
  imp_turkey_one: "Invite Turkey"
  imp_turkey_one_desc: "Inviting Turkey rather than beginning with force will be seen as a gesture of goodwill between us, making it appear as though we aren’t the aggressors. If they decline, however, we will take them by force. Goodwill only gets you so far."
  imp_prepare_balkan_campaign: "Prepare For Balkan Campaign"
  imp_prepare_balkan_campaign_desc: "The Balkan region is a strategic location for us to control giving us a foothold on the European continent. We should begin preparations for our campaign to take the region."
  imp_balkan_campaign: "Balkan Campaign"
  imp_balkan_campaign_desc: "The time has come to begin our operations in the Balkans. Our reports indicate that the region is heavily divided and weak, making it an easy target for us to conquer. With our superior technology and air support, we should be able to quickly subjugate the region."
  imp_wwii_allies: "Intervention in World War II: Allies"
  imp_wwii_allies_desc: "The greater powers of the world are currently embroiled in a global conflict, and it would be wise for us to take advantage of this situation. We can intervene on the side of the Allies and gain valuable experience and resources."
  imp_wwii_axis: "Intervention in World War II: Axis"
  imp_wwii_axis_desc: "The greater powers of the world are currently embroiled in a global conflict, the political structure of the nations in the Axis are more similar to our own, and it would be wise for us to take advantage of this situation. If we intervene on the side of the Axis, we may even be able to take control of more territory once the war is over."
  imp_new_order: "The New Order"
  imp_new_order_desc: "With the conflict known as World War II ending. We can take advantage of the weakened state of the world. The time has come to establish a new order, with us at the top. We can use our superior technology and military might to take control of the world and reshape it in our image."
  imp_conquest_of_europe: "Conquest of Europe"
  imp_conquest_of_europe_desc: "The time has come to begin our campaign to take control of Europe. The nations of Europe still reeling from the aftermath of World War II will be easy targets for us to conquer."
  imp_conquest_of_asia: "Conquest of Asia"
  imp_conquest_of_asia_desc: "According to our intelligence, the nations of Asia are in a state of disarray, with many of them still recovering from the effects of World War II. China particuarly is also in a state of civil war. We should take advantage of this situation and begin our campaign to take control of Asia."
  imp_conquest_of_africa: "Conquest of Africa"
  imp_conquest_of_africa_desc: "Much of Africa has been colonized by the European powers though there are still some independent nations. The time has come to begin our campaign to take control of Africa. The nations of Africa will be easy targets for us to conquer, and the resources of the continent will be valuable for our empire."
  imp_atlantic_naval_bases: "Establish Atlantic Naval Bases"
  imp_atlantic_naval_bases_desc: "Establishing naval bases in the Atlantic Ocean will allow us to project our power across the ocean. This will be crucial for our future campaigns to take control of the American continents."
  imp_conquest_of_north_america: "Conquest of North America"
  imp_conquest_of_north_america_desc: "North America is host to argueably the most powerful nation on the planet known as the United States of America. Our intelligence indicates that any conflict with them would be long and costly due to their large population and industrial capacity. With all that we have accomplished so far, we should be well prepared to face this adversary."
  imp_conquest_of_south_america: "Conquest of South America"
  imp_conquest_of_south_america_desc: "South America is a continent rich in resources and relatively weak militarily. The time has come to begin our campaign to take control of South America. The nations of South America will be easy targets for us to conquer, and the resources of the continent will be valuable for our empire."
  imp_pacific_naval_bases: "Establish Pacific Naval Bases"
  imp_pacific_naval_bases_desc: "With the establishment of naval bases in the Pacific Ocean, we can project our might further to reach the shores of the nations of the Pacific."
  imp_conquest_oceania: "Conquest of Oceania"
  imp_conquest_oceania_desc: "The region of Oceania is made up of many small islands as well as the larger landmasses of Australia, New Zealand, and Indonesia. This land is rich in resources and strategically located, making it a valuable addition to our empire. The time has come to begin our campaign to take control of Oceania."
  imp_empire_of_earth: "The Empire of Earth"
  imp_empire_of_earth_desc: "We have conquered this planet and established Imperial rule over it. Even though the Galactic Empire is gone, we now have this world to call our own and the Empire will live on through us."
  ### Army Branch ###
  imp_army_branch: "Lessons of the Clone Wars"
  imp_army_branch_desc: "We do not have many troops to spare and are heavily reliant on our superior technology. We've been in this situation before during the Clone Wars, when the Droids greatly outnumbered our Clone Troops. We have to adopt strategies that prioritize our Stormtroopers' lives, otherwise we'll have no men left!"
  imp_logistics: "Supply Lines and Logistics"
  imp_logistics_desc: "Logistics is the backbone of any military operation, and we must ensure that our supply lines are secure and efficient. This will allow us to maintain our forces in the field and keep them well-equipped for battle."
  imp_army_one: "Infantry Tactics"
  imp_army_one_desc: "While Stormtroopers are more specialized than the average soldier, infantry should be used as our primary force in combat. Not only can we conscript the locals to bolster our numbers, but we can also effecively train them faster than we could train Stormtroopers."
  imp_army_two: "Army Reforms"
  imp_army_two_desc: "We should implement reforms to our army to improve its efficiency and effectiveness. This could include changes to our training programs, organizational structure, and tactics."
  imp_army_three: "Enhanced Training Programs"
  imp_army_three_desc: "We should invest in the enhancement of our training programs for our troops to improve their combat effectiveness and survivability on the battlefield."
  imp_army_four: "Modernization of Equipment"
  imp_army_four_desc: "We should focus our research and development on improving the weapons and equipment used by our troops."
  imp_army_five:
  imp_army_five_desc:
  imp_army_six: "Imperial Army"
  imp_army_six_desc: "Through discipline, training, and doctrine, our forces have become the embodiment of Imperial Might. With a unified command structure and hardened soldiers, our army will stand ready to crush all opposition."
  imp_recruitment_drive: "Recruitment Drive"
  imp_recruitment_drive_desc: "We should bolster our manpower by recruiting the local population."
  imp_stormtrooper_corps: "The Stormtrooper Corps"
  imp_stormtrooper_corps_desc: "We should focus on training our Stormtroopers to be the best soldiers in the world. They are the backbone of our military, and we must ensure that they are well-trained and equipped for battle."
  imp_marines: "Sea Troopers"
  imp_marines_desc: "Sea Troopers are trained to operate in aquatic environments and can be deployed effectively as marines to secure coastal areas and conduct amphibious assaults."
  imp_paratroopers: "Jet Troopers"
  imp_paratroopers_desc: "Jet Troopers are trained to operate in the air and can be deployed from aircraft to quickly respond to threats on the ground."
  imp_mountaineers: "Snow Troopers"
  imp_mountaineers_desc: "Snow troopers are trained to operate in cold and mountainous environments."
  imp_rangers: "Scout Troopers"
  imp_rangers_desc: "Scout Troopers are trained to operate along with our primary forces in dense wooded areas such as forests and jungles."
  imp_stormtrooper_corps_two: "Expanding the Stormtrooper Corps"
  imp_stormtrooper_corps_two_desc: "We should focus on expanding the Stormtrooper Corps to increase our specialized forces. This will allow us to have a more versatile military that can adapt to different combat situations and environments."
  imp_training_camps: "Training Camps"
  imp_training_camps_desc: "Setting up training camps will allow us to train our troops faster and more efficiently."
  ### Air Branch ###
  imp_air_branch: "Establishing The Imperial Air Force"
  imp_air_branch_desc: "The Empire never truely had an air force as our fighters were designed for space combat integrated in the Imperial Navy, but we will need to adapt to our situation and develop an separate branch of our military focused on air combat and support."
  ### Navy Branch ###
  imp_navy_branch: "Establishing The Imperial Navy"
  imp_navy_branch_desc: "This planet has several continents surrounded by large bodies of water, and we will need a strong navy to control these waters and protect our shores. While in the past our navy was focused on space combat, we will need to adapt our tactics and technology to be effective in naval warfare on the oceans of this planet."