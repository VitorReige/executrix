### Story Events ###
imperial_story.0.t: "Introduction"
imperial_story.0.d: "\"Executrix is an attempt to restructure the original storyline so that it's more consistent, makes sense, and doesn't ruin the integrity of canon. This also means all references to the First Order have been removed. Executrix is meant to be an Executor 2.0, so for all intents and purposes, this is a successor to the original mod. I will leave the original mod on the workshop for anyone that wishes to replay that experience.\" \n-MasterVeo1, Developer of Executor\n\nThe Original Tarkin/Vader path has been restructured and there will eventually be an alternative route available in the future.\n\nIf you have any feedback, leave it on the official Executor Discord which can be found on the mod's steam page. \n\n--STORY--\n\nAfter taking the nearly completed Executrix for a test flight accompanied by many high ranking officials in the Imperial Army and Navy, catastrophe struck. \n\nWhat was supposed to be a many hour jump through hyperspace, Executrix was suddenly lurched into the gravity well of an unknown planet due to one of the main reactors of the ship failing. This sent the Executor crashing down onto the surface. Thankfully due to the skill of the entire crew, we were able to use the remaining engines to move ourselves over land, narrowly escaping a watery grave. We ended up crashing in a vast sea of sand dunes.\n\nLord Vader and Grand Moff Tarkin are both present on the ship due to their personal oversight in the launch of the Super Star Destoryer. Vader and Tarkin are currently discussing whom shall over see the upcoming recovery operations.\n\nCrew is in disarray as the Executor is badly damaged in the crash, navigation systems are completely fried and there is no telling where they are. Both Vader and Tarkin are adept in their fields but the choice of whom shall oversee the upcoming events could shape the future of the surviving crew..."
imperial_story.0.a: "OK"
imperial_story.1.t: "Power Allocation"
imperial_story.1.d: "Executrix is disabled as it exits hyperspace, trapped in the gravity well of Earth. As it plunged down towards the surface, the crew managed to get emergency power on but the amount required to stop a crash landing meant that all of it needed to go into one component."
imperial_story.1.a: "Repulsors will give most room for recovery."
imperial_story.1.b: "We'll tank the blow with our shields."
imperial_story.1.c: "The ship is lost, focus on evacuation."
imperial_story.2.t: "Survey Complete!"
imperial_story.2.d: "A small reconnaissance team of desert troopers have returned from their survey and have made a disturbing discovery. \n\nThe area in which the Executor had crash landed is surrounded by numerous buildings now destoryed and may have once been a city before our arrival. \n\nThere is no telling how the survivors of this city may react to us destroying their homes so measures must be taken. We can first try to save the survivors of this city and persuade them that we were shot down by a neighboring nation and put the blame on them. The alternative would be to execute the remaining survivors and keep our 'landing' secret which would also allows us to harvest the resources of the area without restriction. \n\nThis choice could have ramifications in the future..."
imperial_story.2.a: "Maintain Secrecy"
imperial_story.2.b: "Save and Recruit the Local Populace"
imperial_story.3.t: "Investigation of the Signal"
imperial_story.3.d: "The signal is coming from a piece of radar equipment that split off when we crashed. It's location is a few miles off to the west of a local town. Recovering the component of the ship would be near impossible without risking exposure. The town itself has factories we could use to help reconstruct our ship but would risk us going to war with the nation protecting it. An alternative would be to recover the radar part at night, but would risk us being held back in our reconstruction."
imperial_story.3.a: "Attack Protocol"
imperial_story.3.b: "Stealth Protocol"
imperial_story.4.t: "Construction Zone"
imperial_story.4.d: "We can command our droids to scavenge the area for pieces of the ship, allowing us to recycle the material for more droids. This would speed up the process in the long-run.\n\n Alternatively, we can use those materials to create more weapons and stick with the droids we have now."
imperial_story.4.a: "More Droids"
imperial_story.4.b: "More Weapons"
